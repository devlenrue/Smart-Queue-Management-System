name: smartqueue
description: SmartQueue — Smart Queue Management System client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # state
  flutter_riverpod: ^2.5.1

  # navigation
  go_router: ^14.2.0

  # http
  dio: ^5.4.3

  # storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # formatting
  intl: ^0.19.0

  # charts (admin dashboards, Phase 8)
  fl_chart: ^0.68.0

  # optional QR ticket (§81)
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
