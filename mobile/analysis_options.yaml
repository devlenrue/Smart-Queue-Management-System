include: package:flutter_lints/flutter.yaml

analyzer:
  # Platform scaffolding is generated by `flutter create .` and is not
  # committed, so it is never ours to lint. Listing all six here (rather than
  # only the ones that happen to exist) keeps the Flutter tool's
  # AnalysisOptionsMigration a no-op, so `flutter pub get` stops rewriting this
  # file and leaving a stray diff behind.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
